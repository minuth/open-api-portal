openapi: 3.0.3
info:
  title: 'FinSecure Banking & Payments API'
  version: 2.0.0
  description: |
    Comprehensive demonstration API showcasing all **JOSE (JSON Object Signing and Encryption)**
    cryptographic security patterns using the `x-jose-security` OpenAPI extension:

    ### 🔏 JSON Web Signature (JWS - RFC 7515 & RFC 7797)
    - **Header Attached Signature**: RS256/ES256 compact JWS placed in `X-Signature` header
    - **Detached Header Signature**: `header..signature` with RFC 3230 HTTP `Digest` (SHA-256) & RFC 7797 `b64`
    - **Request Body JWS Token**: Pure compact JWS body for FAPI 1.0/2.0 & RFC 9101 JAR / PAR
    - **Symmetric HMAC Signature**: HS256 pre-shared secret signing for webhooks and internal microservices
    - **X.509 Certificate Chain & Thumbprint**: eIDAS / Open Banking compliance with `x5t#S256` and `x5c`
    - **Critical Protected Headers (crit)**: RFC 7515 §4.1.11 strict header extension processing enforcement

    ### 🔒 JSON Web Encryption (JWE - RFC 7516 & RFC 7518)
    - **Asymmetric Key Wrap**: RSA-OAEP-256 + A256GCM compact 5-part JWE body
    - **Elliptic Curve Key Agreement**: ECDH-ES+A256KW + A256GCM for mobile device binding
    - **Direct Symmetric Encryption**: `dir` + A256GCM zero-overhead pre-shared key encryption
    - **Symmetric AES Key Wrap**: A256KW + A128CBC-HS256 for batch clearing submissions
    - **Encrypted Header Token**: JWE placed in `X-Encrypted-Token` header with cleartext JSON body
    - **Pure Field-Level Encryption (Pure FLE)**: PCI-DSS sensitive fields encrypted into `encData`

    ### 🛡️ Nested & Hybrid Patterns (Both JWS and JWE)
    - **Full Body Sign-Then-Encrypt**: JWS inside JWE (`cty: JWT`) for high-value commercial transfers
    - **FLE + Outer Request Signature (Pattern 1)**: Encrypted `encData` with signed outer JSON body
    - **Nested FLE (Pattern 2)**: Inner sign-then-encrypt isolated inside `encData`

    ### 🔄 Bidirectional Verification
    - **Response Auto-Decryption & Signature Verification**: Automatic decryption and verification with remote JWKS discovery
  contact:
    name: FinSecure Cryptographic Engineering Team
    email: crypto-sec@finsecure-bank.example
servers:
  - url: http://localhost:3000
    description: Primary API Gateway (Unified Portal & Mock Server)

